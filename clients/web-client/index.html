<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat Sockets — Web Client</title>
    <style>
      :root {
        --bg: #0f1420;
        --panel: #1a2132;
        --panel-2: #232c42;
        --accent: #4f8cff;
        --text: #e6e9f0;
        --muted: #8b94a7;
        --system: #c9a227;
        --error: #ff6b6b;
        --private: #b98bff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Roboto, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: var(--panel);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #2c3650;
        flex-wrap: wrap;
      }

      header h1 {
        font-size: 16px;
        margin: 0 12px 0 0;
        font-weight: 600;
      }

      input,
      button {
        font: inherit;
        border-radius: 6px;
        border: 1px solid #2c3650;
        outline: none;
      }

      input {
        background: var(--panel-2);
        color: var(--text);
        padding: 8px 10px;
      }

      input:focus {
        border-color: var(--accent);
      }

      button {
        background: var(--accent);
        color: #fff;
        padding: 8px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        filter: brightness(1.08);
      }

      button.secondary {
        background: var(--panel-2);
        color: var(--text);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #status {
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
      }

      #status.online {
        color: #5ad28a;
      }

      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .line {
        line-height: 1.4;
        word-break: break-word;
      }

      .line .who {
        font-weight: 600;
        color: var(--accent);
      }

      .line.self .who {
        color: #5ad28a;
      }

      .line.private .who {
        color: var(--private);
      }

      .line.private .tag {
        color: var(--private);
        font-size: 12px;
        margin-right: 4px;
      }

      .line.system {
        color: var(--system);
        font-style: italic;
        font-size: 13px;
      }

      .line.error {
        color: var(--error);
        font-size: 13px;
      }

      .line .time {
        color: var(--muted);
        font-size: 11px;
        margin-right: 6px;
      }

      aside {
        width: 200px;
        background: var(--panel);
        border-left: 1px solid #2c3650;
        padding: 12px;
        overflow-y: auto;
      }

      aside h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0 8px;
      }

      .user {
        padding: 6px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      .user:hover {
        background: var(--panel-2);
      }

      .user.self {
        color: #5ad28a;
        cursor: default;
      }

      .user.active {
        background: var(--private);
        color: #fff;
      }

      footer {
        background: var(--panel);
        border-top: 1px solid #2c3650;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #target {
        font-size: 13px;
        color: var(--muted);
        min-width: 150px;
      }

      #target.private {
        color: var(--private);
        font-weight: 600;
      }

      #messageInput {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Chat Sockets</h1>
      <input id="hostInput" type="text" value="localhost" size="10" />
      <input id="portInput" type="text" value="3001" size="5" />
      <button id="connectBtn">Conectar</button>
      <span id="status">Desconectado</span>
    </header>

    <main>
      <div id="chat"></div>
      <aside>
        <h2>Usuarios</h2>
        <div id="users"></div>
      </aside>
    </main>

    <footer>
      <span id="target">→ Todos</span>
      <button id="publicBtn" class="secondary">Volver a público</button>
      <input id="messageInput" type="text" placeholder="Escribe un mensaje..." disabled />
      <button id="sendBtn" disabled>Enviar</button>
    </footer>

    <script type="module">
      import { ChatClient } from "./dist/client.js";

      // --- Referencias al DOM ---
      const hostInput = document.getElementById("hostInput");
      const portInput = document.getElementById("portInput");
      const connectBtn = document.getElementById("connectBtn");
      const status = document.getElementById("status");
      const chat = document.getElementById("chat");
      const usersEl = document.getElementById("users");
      const target = document.getElementById("target");
      const publicBtn = document.getElementById("publicBtn");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");

      // --- Estado de la UI ---
      let client = null;
      let privateTarget = null; // username destino, o null para público

      // --- Helpers de render ---
      function timeOf(iso) {
        const d = new Date(iso);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function appendLine(node) {
        const atBottom =
          chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
        chat.appendChild(node);
        if (atBottom) {
          chat.scrollTop = chat.scrollHeight;
        }
      }

      function addMessage(packet) {
        const line = document.createElement("div");
        const isPrivate = packet.scope === "private";
        const isSelf = client && packet.from === client.selfName;
        line.className =
          "line" + (isPrivate ? " private" : "") + (isSelf ? " self" : "");

        const time = document.createElement("span");
        time.className = "time";
        time.textContent = timeOf(packet.timestamp);
        line.appendChild(time);

        if (isPrivate) {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "(privado)";
          line.appendChild(tag);
        }

        const who = document.createElement("span");
        who.className = "who";
        who.textContent = packet.from + ": ";
        line.appendChild(who);

        line.appendChild(document.createTextNode(packet.text));
        appendLine(line);
      }

      function addSystem(text, iso) {
        const line = document.createElement("div");
        line.className = "line system";
        line.textContent = "[sistema] " + text;
        appendLine(line);
      }

      function addError(text) {
        const line = document.createElement("div");
        line.className = "line error";
        line.textContent = "[error] " + text;
        appendLine(line);
      }

      // Eco local de lo que enviamos (el servidor no nos reenvía nuestros mensajes).
      function addOwnMessage(text, to) {
        const line = document.createElement("div");
        const isPrivate = to !== null;
        line.className = "line self" + (isPrivate ? " private" : "");
        const label = isPrivate ? `tú → ${to} (privado): ` : "tú: ";
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = label;
        line.appendChild(who);
        line.appendChild(document.createTextNode(text));
        appendLine(line);
      }

      function renderUsers(users) {
        usersEl.innerHTML = "";
        users.forEach((user) => {
          const el = document.createElement("div");
          const isSelf = client && user.username === client.selfName;
          const isActive = user.username === privateTarget;
          el.className =
            "user" + (isSelf ? " self" : "") + (isActive ? " active" : "");
          el.textContent = user.username + (isSelf ? " (tú)" : "");
          if (!isSelf) {
            el.addEventListener("click", () => setPrivateTarget(user.username));
          }
          usersEl.appendChild(el);
        });
      }

      function setPrivateTarget(username) {
        privateTarget = username;
        target.textContent = `→ ${username} (privado)`;
        target.className = "private";
        if (client) {
          renderUsers(client.users);
        }
        messageInput.focus();
      }

      function setPublicTarget() {
        privateTarget = null;
        target.textContent = "→ Todos";
        target.className = "";
        if (client) {
          renderUsers(client.users);
        }
        messageInput.focus();
      }

      function setConnected(connected) {
        status.textContent = connected ? "Conectado" : "Desconectado";
        status.className = connected ? "online" : "";
        messageInput.disabled = !connected;
        sendBtn.disabled = !connected;
        connectBtn.textContent = connected ? "Reconectar" : "Conectar";
      }

      // --- Acciones ---
      function connect() {
        const host = hostInput.value.trim() || "localhost";
        const port = portInput.value.trim() || "3001";
        const url = `ws://${host}:${port}`;

        client = new ChatClient(url, {
          onWelcome: (p) => {
            addSystem(p.message);
            addSystem(`Conectado como ${p.self}.`);
            renderUsers(p.users);
          },
          onUsers: (users) => renderUsers(users),
          onMessage: (p) => addMessage(p),
          onSystem: (p) => addSystem(p.message),
          onError: (p) => addError(p.message),
          onOpen: () => setConnected(true),
          onClose: () => {
            setConnected(false);
            addSystem("Conexión cerrada.");
          },
        });

        setPublicTarget();
        client.connect();
      }

      function send() {
        const text = messageInput.value.trim();
        if (text.length === 0 || !client) {
          return;
        }
        if (privateTarget !== null) {
          client.sendPrivateMessage(privateTarget, text);
          addOwnMessage(text, privateTarget);
        } else {
          client.sendPublicMessage(text);
          addOwnMessage(text, null);
        }
        messageInput.value = "";
        messageInput.focus();
      }

      // --- Eventos de la UI ---
      connectBtn.addEventListener("click", connect);
      sendBtn.addEventListener("click", send);
      publicBtn.addEventListener("click", setPublicTarget);
      messageInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          send();
        }
      });
    </script>
  </body>
</html>
